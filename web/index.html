<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0d47a1">
  <title>Pharoah ERP - Cloud Web Portal</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      background-color: #0f172a;
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
    }
    #error-reporter {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%;
      background: #b91c1c; color: white;
      padding: 15px; font-family: monospace;
      font-size: 12px; z-index: 9999999;
      box-sizing: border-box;
    }
  </style>
</head>
<body>
  <div id="error-reporter"></div>
  <script>
    // Show any hidden browser/engine error directly on screen
    window.addEventListener('error', function(e) {
      var box = document.getElementById('error-reporter');
      if (box) {
        box.style.display = 'block';
        box.innerText = 'Browser Error: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')';
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
