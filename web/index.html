<!DOCTYPE html>
<html>
<head>
  <base href="./">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pharoah ERP</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0; padding: 0; background-color: #0D47A1;
      height: 100vh; display: flex; justify-content: center; align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white;
    }
    .spinner {
      width: 42px; height: 42px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #FF9800; border-radius: 50%;
      animation: spin 0.7s linear infinite; margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div style="text-align: center;">
    <div class="spinner" style="margin: 0 auto 12px auto;"></div>
    <div style="font-weight: bold; letter-spacing: 1px; font-size: 18px;">PHAROAH CLOUD ERP</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
